[package]
name = "king-broadcast-control"
version = "0.1.0"
description = "KING CLUB Windows broadcast control console"
authors = ["KING CLUB"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "king_broadcast_control_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
font-kit = "0.14"
lofty = "0.25"
symphonia = { version = "0.5", features = ["all"] }
stratum-dsp = "1.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
encoding_rs = "0.8"
blake3 = "1.8"
flate2 = "1.1.9"
libloading = "0.8"
king-vocal-engine = { path = "../../vocal-engine" }

[profile.dev]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }
