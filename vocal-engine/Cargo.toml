[package]
name = "king-vocal-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Low-latency 48 kHz vocal loopback engine for KING Broadcast Control"
license = "Proprietary"

[dependencies]
cpal = "0.18.2"
ctrlc = "3.5"
hound = "3.5"
rtrb = "0.3.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.dev]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
